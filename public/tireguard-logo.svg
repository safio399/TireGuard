<svg viewBox="0 0 520 200" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#050810"/>
    </radialGradient>

    <radialGradient id="tire-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00d4ff" stop-opacity="0.18"/>
      <stop offset="60%"  stop-color="#0066cc" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000"    stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="shield-inner" cx="50%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#0a1a3a"/>
      <stop offset="100%" stop-color="#020510"/>
    </radialGradient>

    <filter id="glow-blue" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-red" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="text-glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="shield-clip">
      <path d="M100 28 L148 40 L148 90 Q148 122 100 138 Q52 122 52 90 L52 40 Z"/>
    </clipPath>

    <linearGradient id="circuit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00d4ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0088ff" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="shield-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#00aaff" stop-opacity="0.9"/>
      <stop offset="50%"  stop-color="#0066cc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#003380" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="wordmark-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#e8f4ff"/>
      <stop offset="55%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a0ccff"/>
    </linearGradient>

    <linearGradient id="sub-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00aaff"/>
      <stop offset="100%" stop-color="#0066cc"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="520" height="200" fill="url(#bg-grad)" rx="12"/>

  <!-- Subtle grid lines -->
  <g opacity="0.04" stroke="#00aaff" stroke-width="0.5">
    <line x1="0" y1="40" x2="520" y2="40"/>
    <line x1="0" y1="80" x2="520" y2="80"/>
    <line x1="0" y1="120" x2="520" y2="120"/>
    <line x1="0" y1="160" x2="520" y2="160"/>
    <line x1="80" y1="0" x2="80" y2="200"/>
    <line x1="160" y1="0" x2="160" y2="200"/>
    <line x1="240" y1="0" x2="240" y2="200"/>
    <line x1="320" y1="0" x2="320" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="480" y1="0" x2="480" y2="200"/>
  </g>

  <!-- Scanline sweep -->
  <rect class="scan" x="52" y="28" width="96" height="4" fill="#00d4ff" opacity="0.12" clip-path="url(#shield-clip)"/>

  <!-- === TIRE (outer ring) === -->
  <!-- Glow halo -->
  <circle cx="100" cy="100" r="62" fill="url(#tire-glow)" class="glow-anim"/>

  <!-- Outer tire tread ring -->
  <circle cx="100" cy="100" r="58" fill="none" stroke="#001a33" stroke-width="14"/>

  <!-- Tread segments — tick marks around outer rim -->
  <g filter="url(#glow-blue)">
    <g stroke="#00aaff" stroke-width="2.5" stroke-linecap="round">
      <!-- 16 tread marks at 22.5° intervals -->
      <line x1="100" y1="43"  x2="100" y2="50"  transform="rotate(0   100 100)"/>
      <line x1="100" y1="43"  x2="100" y2="50"  transform="rotate(22.5 100 100)"/>
      <line x1="100" y1="43"  x2="100" y2="50"  transform="rotate(45  100 100)"/>
      <line x1="100" y1="43"  x2="100" y2="50"  transform="rotate(67.5 100 100)"/>
      <line x1="100" y1="43"  x2="100" y2="50"  transform="rotate(90  100 100)"/>
      <line x1="100" y1="43"  x2="100" y2="50"  transform="rotate(112.5 100 100)"/>
      <line x1="100" y1="43"  x2="100" y2="50"  transform="rotate(135 100 100)"/>
      <line x1="100" y1="43"  x2="100" y2="50"  transform="rotate(157.5 100 100)"/>
      <line x1="100" y1="43"  x2="100" y2="50"  transform="rotate(180 100 100)"/>
      <line x1="100" y1="43"  x2="100" y2="50"  transform="rotate(202.5 100 100)"/>
      <line x1="100" y1="43"  x2="100" y2="50"  transform="rotate(225 100 100)"/>
      <line x1="100" y1="43"  x2="100" y2="50"  transform="rotate(247.5 100 100)"/>
      <line x1="100" y1="43"  x2="100" y2="50"  transform="rotate(270 100 100)"/>
      <line x1="100" y1="43"  x2="100" y2="50"  transform="rotate(292.5 100 100)"/>
      <line x1="100" y1="43"  x2="100" y2="50"  transform="rotate(315 100 100)"/>
      <line x1="100" y1="43"  x2="100" y2="50"  transform="rotate(337.5 100 100)"/>
    </g>
  </g>

  <!-- Outer tire border ring -->
  <circle cx="100" cy="100" r="58" fill="none" stroke="url(#shield-edge)" stroke-width="1.5" opacity="0.9" filter="url(#glow-blue)"/>
  <!-- Inner tire wall -->
  <circle cx="100" cy="100" r="44" fill="none" stroke="#00aaff" stroke-width="0.8" opacity="0.4"/>

  <!-- Spoke/rim structure — 4 spokes -->
  <g stroke="#001e3d" stroke-width="5" opacity="0.8">
    <line x1="100" y1="56" x2="100" y2="144"/>
    <line x1="56"  y1="100" x2="144" y2="100"/>
  </g>
  <g stroke="#002a50" stroke-width="3" opacity="0.6">
    <line x1="100" y1="56" x2="100" y2="144" transform="rotate(45 100 100)"/>
  </g>

  <!-- Rim center hub -->
  <circle cx="100" cy="100" r="18" fill="#050e1f" stroke="#00aaff" stroke-width="1" opacity="0.9"/>
  <circle cx="100" cy="100" r="12" fill="#020810"/>
  <circle cx="100" cy="100" r="5"  fill="#00aaff" opacity="0.5" filter="url(#glow-soft)"/>
  <circle cx="100" cy="100" r="3"  fill="#00d4ff"/>

  <!-- === SHIELD (overlaid on lower-center of tire) === -->
  <!-- Shield glow -->
  <path d="M100 55 L136 65 L136 105 Q136 130 100 143 Q64 130 64 105 L64 65 Z"
        fill="#00aaff" opacity="0.06" filter="url(#glow-soft)"/>

  <!-- Shield body -->
  <path d="M100 55 L136 65 L136 105 Q136 130 100 143 Q64 130 64 105 L64 65 Z"
        fill="url(#shield-inner)" stroke="url(#shield-edge)" stroke-width="1.5"/>

  <!-- Shield inner border -->
  <path d="M100 61 L130 70 L130 105 Q130 126 100 137 Q70 126 70 105 L70 70 Z"
        fill="none" stroke="#00aaff" stroke-width="0.5" opacity="0.3"/>

  <!-- === CIRCUIT PATTERNS inside shield === -->
  <g clip-path="url(#shield-clip)" filter="url(#glow-blue)">

    <!-- Horizontal trace lines -->
    <g stroke="url(#circuit-grad)" stroke-width="1" fill="none" opacity="0.75" class="trace-anim"
       stroke-dasharray="200" stroke-dashoffset="200">
      <path d="M72 88 L84 88 L84 81 L92 81"/>
      <path d="M108 81 L118 81 L118 88 L128 88"/>
      <path d="M72 112 L80 112 L80 120 L90 120 L90 112 L100 112"/>
      <path d="M100 112 L110 112 L110 120 L120 120 L120 112 L128 112"/>
    </g>

    <!-- Vertical traces -->
    <g stroke="#0088ff" stroke-width="1" fill="none" opacity="0.5" class="trace-anim"
       stroke-dasharray="200" stroke-dashoffset="200">
      <path d="M86 72 L86 81"/>
      <path d="M114 72 L114 81"/>
      <path d="M80 88 L80 100 L86 100"/>
      <path d="M120 88 L120 100 L114 100"/>
    </g>

    <!-- Node dots at circuit junctions -->
    <g fill="#00d4ff" opacity="0.9">
      <circle cx="84" cy="81" r="1.8"/>
      <circle cx="118" cy="81" r="1.8"/>
      <circle cx="80" cy="100" r="1.8"/>
      <circle cx="120" cy="100" r="1.8"/>
      <circle cx="90" cy="120" r="1.8"/>
      <circle cx="110" cy="120" r="1.8"/>
    </g>

    <!-- Center AI core — crosshair target -->
    <circle cx="100" cy="97" r="9" fill="none" stroke="#00aaff" stroke-width="1" opacity="0.7"/>
    <circle cx="100" cy="97" r="5" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.9"/>
    <line x1="91" y1="97" x2="95" y2="97" stroke="#00d4ff" stroke-width="1" opacity="0.8"/>
    <line x1="105" y1="97" x2="109" y2="97" stroke="#00d4ff" stroke-width="1" opacity="0.8"/>
    <line x1="100" y1="88" x2="100" y2="92" stroke="#00d4ff" stroke-width="1" opacity="0.8"/>
    <line x1="100" y1="102" x2="100" y2="106" stroke="#00d4ff" stroke-width="1" opacity="0.8"/>
    <circle cx="100" cy="97" r="2" fill="#00d4ff" opacity="0.9"/>
  </g>

  <!-- === RED ALERT INDICATOR — pulse dot top-right of shield === -->
  <g filter="url(#glow-red)">
    <circle cx="136" cy="65" r="5" fill="#ff2020" opacity="0.25" class="ring-pulse"/>
    <circle cx="136" cy="65" r="3.5" fill="#ff2020" opacity="0.35" class="ring-pulse"/>
    <circle class="dot-pulse" cx="136" cy="65" r="3" fill="#ff3333"/>
  </g>

  <!-- === PULSE / EKG LINE — below the logo mark === -->
  <g transform="translate(52, 152)" filter="url(#glow-blue)" opacity="0.8">
    <polyline
      points="0,8 8,8 12,2 16,14 20,0 24,14 28,8 36,8 40,5 44,11 48,8 96,8"
      fill="none" stroke="#00aaff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
      class="trace-anim" stroke-dasharray="200" stroke-dashoffset="200"/>
    <!-- Dot at pulse peak -->
    <circle cx="20" cy="0" r="2" fill="#ff3333" filter="url(#glow-red)" class="dot-pulse"/>
  </g>

  <!-- === WORDMARK === -->
  <!-- TIREGUARD main text -->
  <text x="178" y="105"
        font-family="'Arial Black', 'Impact', sans-serif"
        font-size="46" font-weight="900" letter-spacing="2"
        fill="url(#wordmark-grad)" filter="url(#text-glow)">
    TIRE<tspan fill="#00aaff" filter="url(#glow-blue)">GUARD</tspan>
  </text>

  <!-- Tagline -->
  <text x="180" y="126"
        font-family="'Arial', 'Helvetica', sans-serif"
        font-size="11" font-weight="400" letter-spacing="5"
        fill="url(#sub-grad)" opacity="0.85">
    PREDICTIVE MAINTENANCE · AI
  </text>

  <!-- Separator line under tagline -->
  <line x1="180" y1="133" x2="490" y2="133" stroke="#00aaff" stroke-width="0.5" opacity="0.3"/>

  <!-- Version / system tag — bottom right, control-room flavor -->
  <text x="490" y="148"
        font-family="'Courier New', monospace"
        font-size="9" letter-spacing="1"
        fill="#00aaff" opacity="0.4" text-anchor="end">
    SYS v2.4 · ONLINE
  </text>

  <!-- Status indicator row — bottom right -->
  <g transform="translate(310, 158)">
    <!-- Green status pill -->
    <rect x="0" y="0" width="54" height="14" rx="7" fill="#003a00" opacity="0.7"/>
    <circle cx="10" cy="7" r="3" fill="#00cc44" class="dot-pulse"/>
    <text x="17" y="10" font-family="'Courier New', monospace" font-size="7.5" fill="#00cc44" letter-spacing="0.5">ONLINE</text>

    <!-- Red alert pill -->
    <rect x="62" y="0" width="54" height="14" rx="7" fill="#3a0000" opacity="0.7"/>
    <circle cx="72" cy="7" r="3" fill="#ff3333" class="dot-pulse"/>
    <text x="79" y="10" font-family="'Courier New', monospace" font-size="7.5" fill="#ff4444" letter-spacing="0.5">3 ALERT</text>

    <!-- Model accuracy pill -->
    <rect x="124" y="0" width="62" height="14" rx="7" fill="#001a33" opacity="0.7"/>
    <circle cx="134" cy="7" r="3" fill="#00aaff"/>
    <text x="141" y="10" font-family="'Courier New', monospace" font-size="7.5" fill="#00aaff" letter-spacing="0.5">AUC 96.6%</text>
  </g>

  <!-- Corner bracket decorations — control room HUD feel -->
  <g stroke="#00aaff" stroke-width="1" opacity="0.25" fill="none">
    <!-- Top-left -->
    <path d="M8 8 L8 22 M8 8 L22 8"/>
    <!-- Top-right -->
    <path d="M512 8 L512 22 M512 8 L498 8"/>
    <!-- Bottom-left -->
    <path d="M8 192 L8 178 M8 192 L22 192"/>
    <!-- Bottom-right -->
    <path d="M512 192 L512 178 M512 192 L498 192"/>
  </g>
</svg>