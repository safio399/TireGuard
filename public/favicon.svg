<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="100%" height="200"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description><dc:creator>RealFaviconGenerator</dc:creator><dc:source>https://realfavicongenerator.net</dc:source></rdf:Description></rdf:RDF></metadata><defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0f1e"></stop>
      <stop offset="100%" stop-color="#050810"></stop>
    </radialGradient>

    <radialGradient id="tire-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.18"></stop>
      <stop offset="60%" stop-color="#0066cc" stop-opacity="0.08"></stop>
      <stop offset="100%" stop-color="#000" stop-opacity="0"></stop>
    </radialGradient>

    <radialGradient id="shield-inner" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#0a1a3a"></stop>
      <stop offset="100%" stop-color="#020510"></stop>
    </radialGradient>

    <filter id="glow-blue" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"></feGaussianBlur>
      <feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    <filter id="glow-red" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="blur"></feGaussianBlur>
      <feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    <filter id="glow-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>
      <feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    <filter id="text-glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"></feGaussianBlur>
      <feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>

    <clipPath id="shield-clip">
      <path d="M100 28 L148 40 L148 90 Q148 122 100 138 Q52 122 52 90 L52 40 Z"></path>
    </clipPath>

    <linearGradient id="circuit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.9"></stop>
      <stop offset="100%" stop-color="#0088ff" stop-opacity="0.5"></stop>
    </linearGradient>

    <linearGradient id="shield-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00aaff" stop-opacity="0.9"></stop>
      <stop offset="50%" stop-color="#0066cc" stop-opacity="0.6"></stop>
      <stop offset="100%" stop-color="#003380" stop-opacity="0.3"></stop>
    </linearGradient>

    <linearGradient id="wordmark-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8f4ff"></stop>
      <stop offset="55%" stop-color="#ffffff"></stop>
      <stop offset="100%" stop-color="#a0ccff"></stop>
    </linearGradient>

    <linearGradient id="sub-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00aaff"></stop>
      <stop offset="100%" stop-color="#0066cc"></stop>
    </linearGradient>
  </defs><rect width="520" height="200" fill="url(#bg-grad)" rx="12"></rect><g opacity="0.04" stroke="#00aaff" stroke-width="0.5">
    <line x1="0" y1="40" x2="520" y2="40"></line>
    <line x1="0" y1="80" x2="520" y2="80"></line>
    <line x1="0" y1="120" x2="520" y2="120"></line>
    <line x1="0" y1="160" x2="520" y2="160"></line>
    <line x1="80" y1="0" x2="80" y2="200"></line>
    <line x1="160" y1="0" x2="160" y2="200"></line>
    <line x1="240" y1="0" x2="240" y2="200"></line>
    <line x1="320" y1="0" x2="320" y2="200"></line>
    <line x1="400" y1="0" x2="400" y2="200"></line>
    <line x1="480" y1="0" x2="480" y2="200"></line>
  </g><rect class="scan" x="52" y="28" width="96" height="4" fill="#00d4ff" opacity="0.12" clip-path="url(#shield-clip)"></rect><circle cx="100" cy="100" r="62" fill="url(#tire-glow)" class="glow-anim"></circle><circle cx="100" cy="100" r="58" fill="none" stroke="#001a33" stroke-width="14"></circle><g filter="url(#glow-blue)">
    <g stroke="#00aaff" stroke-width="2.5" stroke-linecap="round">
      <!-- 16 tread marks at 22.5° intervals -->
      <line x1="100" y1="43" x2="100" y2="50" transform="rotate(0   100 100)"></line>
      <line x1="100" y1="43" x2="100" y2="50" transform="rotate(22.5 100 100)"></line>
      <line x1="100" y1="43" x2="100" y2="50" transform="rotate(45  100 100)"></line>
      <line x1="100" y1="43" x2="100" y2="50" transform="rotate(67.5 100 100)"></line>
      <line x1="100" y1="43" x2="100" y2="50" transform="rotate(90  100 100)"></line>
      <line x1="100" y1="43" x2="100" y2="50" transform="rotate(112.5 100 100)"></line>
      <line x1="100" y1="43" x2="100" y2="50" transform="rotate(135 100 100)"></line>
      <line x1="100" y1="43" x2="100" y2="50" transform="rotate(157.5 100 100)"></line>
      <line x1="100" y1="43" x2="100" y2="50" transform="rotate(180 100 100)"></line>
      <line x1="100" y1="43" x2="100" y2="50" transform="rotate(202.5 100 100)"></line>
      <line x1="100" y1="43" x2="100" y2="50" transform="rotate(225 100 100)"></line>
      <line x1="100" y1="43" x2="100" y2="50" transform="rotate(247.5 100 100)"></line>
      <line x1="100" y1="43" x2="100" y2="50" transform="rotate(270 100 100)"></line>
      <line x1="100" y1="43" x2="100" y2="50" transform="rotate(292.5 100 100)"></line>
      <line x1="100" y1="43" x2="100" y2="50" transform="rotate(315 100 100)"></line>
      <line x1="100" y1="43" x2="100" y2="50" transform="rotate(337.5 100 100)"></line>
    </g>
  </g><circle cx="100" cy="100" r="58" fill="none" stroke="url(#shield-edge)" stroke-width="1.5" opacity="0.9" filter="url(#glow-blue)"></circle><circle cx="100" cy="100" r="44" fill="none" stroke="#00aaff" stroke-width="0.8" opacity="0.4"></circle><g stroke="#001e3d" stroke-width="5" opacity="0.8">
    <line x1="100" y1="56" x2="100" y2="144"></line>
    <line x1="56" y1="100" x2="144" y2="100"></line>
  </g><g stroke="#002a50" stroke-width="3" opacity="0.6">
    <line x1="100" y1="56" x2="100" y2="144" transform="rotate(45 100 100)"></line>
  </g><circle cx="100" cy="100" r="18" fill="#050e1f" stroke="#00aaff" stroke-width="1" opacity="0.9"></circle><circle cx="100" cy="100" r="12" fill="#020810"></circle><circle cx="100" cy="100" r="5" fill="#00aaff" opacity="0.5" filter="url(#glow-soft)"></circle><circle cx="100" cy="100" r="3" fill="#00d4ff"></circle><path d="M100 55 L136 65 L136 105 Q136 130 100 143 Q64 130 64 105 L64 65 Z" fill="#00aaff" opacity="0.06" filter="url(#glow-soft)"></path><path d="M100 55 L136 65 L136 105 Q136 130 100 143 Q64 130 64 105 L64 65 Z" fill="url(#shield-inner)" stroke="url(#shield-edge)" stroke-width="1.5"></path><path d="M100 61 L130 70 L130 105 Q130 126 100 137 Q70 126 70 105 L70 70 Z" fill="none" stroke="#00aaff" stroke-width="0.5" opacity="0.3"></path><g clip-path="url(#shield-clip)" filter="url(#glow-blue)">

    <!-- Horizontal trace lines -->
    <g stroke="url(#circuit-grad)" stroke-width="1" fill="none" opacity="0.75" class="trace-anim" stroke-dasharray="200" stroke-dashoffset="200">
      <path d="M72 88 L84 88 L84 81 L92 81"></path>
      <path d="M108 81 L118 81 L118 88 L128 88"></path>
      <path d="M72 112 L80 112 L80 120 L90 120 L90 112 L100 112"></path>
      <path d="M100 112 L110 112 L110 120 L120 120 L120 112 L128 112"></path>
    </g>

    <!-- Vertical traces -->
    <g stroke="#0088ff" stroke-width="1" fill="none" opacity="0.5" class="trace-anim" stroke-dasharray="200" stroke-dashoffset="200">
      <path d="M86 72 L86 81"></path>
      <path d="M114 72 L114 81"></path>
      <path d="M80 88 L80 100 L86 100"></path>
      <path d="M120 88 L120 100 L114 100"></path>
    </g>

    <!-- Node dots at circuit junctions -->
    <g fill="#00d4ff" opacity="0.9">
      <circle cx="84" cy="81" r="1.8"></circle>
      <circle cx="118" cy="81" r="1.8"></circle>
      <circle cx="80" cy="100" r="1.8"></circle>
      <circle cx="120" cy="100" r="1.8"></circle>
      <circle cx="90" cy="120" r="1.8"></circle>
      <circle cx="110" cy="120" r="1.8"></circle>
    </g>

    <!-- Center AI core — crosshair target -->
    <circle cx="100" cy="97" r="9" fill="none" stroke="#00aaff" stroke-width="1" opacity="0.7"></circle>
    <circle cx="100" cy="97" r="5" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.9"></circle>
    <line x1="91" y1="97" x2="95" y2="97" stroke="#00d4ff" stroke-width="1" opacity="0.8"></line>
    <line x1="105" y1="97" x2="109" y2="97" stroke="#00d4ff" stroke-width="1" opacity="0.8"></line>
    <line x1="100" y1="88" x2="100" y2="92" stroke="#00d4ff" stroke-width="1" opacity="0.8"></line>
    <line x1="100" y1="102" x2="100" y2="106" stroke="#00d4ff" stroke-width="1" opacity="0.8"></line>
    <circle cx="100" cy="97" r="2" fill="#00d4ff" opacity="0.9"></circle>
  </g><g filter="url(#glow-red)">
    <circle cx="136" cy="65" r="5" fill="#ff2020" opacity="0.25" class="ring-pulse"></circle>
    <circle cx="136" cy="65" r="3.5" fill="#ff2020" opacity="0.35" class="ring-pulse"></circle>
    <circle class="dot-pulse" cx="136" cy="65" r="3" fill="#ff3333"></circle>
  </g><g transform="translate(52, 152)" filter="url(#glow-blue)" opacity="0.8">
    <polyline points="0,8 8,8 12,2 16,14 20,0 24,14 28,8 36,8 40,5 44,11 48,8 96,8" fill="none" stroke="#00aaff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="trace-anim" stroke-dasharray="200" stroke-dashoffset="200"></polyline>
    <!-- Dot at pulse peak -->
    <circle cx="20" cy="0" r="2" fill="#ff3333" filter="url(#glow-red)" class="dot-pulse"></circle>
  </g></svg>